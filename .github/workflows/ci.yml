name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      # https://api.github.com/repos/actions/checkout/git/ref/tags/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://api.github.com/repos/actions/setup-python/git/ref/tags/v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tooling
        run: |
          python -m pip install --upgrade pip build
          python -m pip install ".[dev]"
          python -m pip check
      - name: Check Python formatting
        run: python -m ruff format --check src tests tools
      - name: Check Java formatting
        if: matrix.python-version == '3.12'
        run: python tools/format_java.py --check --java "${JAVA_HOME_21_X64:?}/bin/java"
      - name: Run synthetic unit tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify packaged Java scripts and license notices
        run: python tools/check_distribution.py
