name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      # https://api.github.com/repos/actions/checkout/git/ref/tags/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://api.github.com/repos/actions/setup-python/git/ref/tags/v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tooling
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .
          python -m pip check
      - name: Run synthetic unit tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify packaged Java scripts and license notices
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path
          import tarfile
          import zipfile

          java = {
              'DecompileVIState.java',
              'ImportLabVIEW13.java',
              'ImportVIFacts.java',
              'ImportVIMetadata.java',
              'RecoverVIStateDispatch.java',
              'ValidateExportLabVIEW13.java',
          }
          licenses = ['LICENSE', 'licenses/pylabview-MIT.txt']
          wheels = list(Path('dist').glob('*.whl'))
          sources = list(Path('dist').glob('*.tar.gz'))
          assert len(wheels) == len(sources) == 1, 'Expected one wheel and one sdist'
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              bundled_java = {Path(name).name for name in names
                              if name.startswith('labview_vi_to_ghidra/') and name.endswith('.java')}
              assert bundled_java == java, bundled_java
              for name in java:
                  assert archive.read('labview_vi_to_ghidra/' + name) == Path(name).read_bytes(), name
              metadata_paths = [name for name in names if name.endswith('.dist-info/METADATA')]
              assert len(metadata_paths) == 1, metadata_paths
              metadata_path = metadata_paths[0]
              metadata = BytesParser().parsebytes(archive.read(metadata_path))
              assert metadata['License-Expression'] == 'MIT'
              assert set(metadata.get_all('License-File', [])) == set(licenses)
              dist_info = metadata_path.rsplit('/', 1)[0]
              for name in licenses:
                  assert archive.read(dist_info + '/licenses/' + name) == Path(name).read_bytes(), name
          with tarfile.open(sources[0], 'r:gz') as archive:
              root = archive.getnames()[0].split('/', 1)[0]
              for name in java | set(licenses):
                  member = archive.extractfile(root + '/' + name)
                  assert member is not None, name
                  assert member.read() == Path(name).read_bytes(), name
              assert archive.getmember(root + '/tests/test_embed_vi.py').isfile()
          print('Verified six Java scripts and both license notices in wheel and sdist')
          PY
